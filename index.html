<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паспорт Великой Империи Величественных Капибар</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Библиотека для PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .hand-drawn { font-family: 'Caveat', cursive; }
        .hand-drawn-title { font-family: 'Amatic SC', cursive; }
        @media print { .no-print { display: none !important; } }
        .passport-cover { background-color: #991b1b; border: 1px solid #7f1d1d; }
        .portrait-img {
            width: 30mm;
            height: 40mm;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .placeholder-img {
            background: linear-gradient(45deg, #f3f4f6 25%, #e5e7eb 25%, #e5e7eb 50%, #f3f4f6 50%, #f3f4f6 75%, #e5e7eb 75%);
            background-size: 20px 20px;
        }
        #capture-area {
            transform: rotate(180deg);
            transform-origin: center;
        }
        @media print {
            #capture-area {
                transform: none;
            }
        }
        .preview-inner {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-stone-100 text-slate-900 min-h-screen">
    <div id="app-root">
        <div class="flex flex-col md:flex-row min-h-screen gap-4 p-4 md:p-6">
            <!-- Панель управления -->
            <aside class="w-full md:w-1/3 space-y-4 md:space-y-6 no-print">
                <header class="bg-red-800 text-white p-4 md:p-6 rounded-xl md:rounded-2xl shadow-xl border-b-4 border-red-950">
                    <h1 class="text-3xl md:text-4xl font-bold hand-drawn-title flex items-center gap-3 text-yellow-400">
                        Канцелярия В.И.В.К.
                    </h1>
                    <p class="opacity-90 mt-2 font-medium text-sm md:text-base">Создание документа №67</p>
                </header>

                <div class="bg-white p-4 md:p-6 rounded-xl md:rounded-2xl shadow-lg space-y-4 border-2 border-slate-200">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Полное имя (Ф.И.О.)</label>
                        <input id="input-name" type="text" class="w-full p-3 border-2 border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none hand-drawn text-lg md:text-xl" placeholder="Введите имя...">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Религия</label>
                        <select id="select-religion" class="w-full p-3 border-2 border-slate-300 rounded-lg outline-none hand-drawn text-lg md:text-xl bg-white cursor-pointer">
                            <option value="Капибары">Капибары</option>
                            <option value="Грибовики">Грибовики</option>
                            <option value="Скебобы">Скебобы</option>
                            <option value="Тапки">Тапки</option>
                            <option value="Нейтралы">Нейтралы</option>
                            <option value="Смайлы">Смайлы</option>
                            <option value="Мопсы">Мопсы</option>
                            <option value="Берсерки">Берсерки</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Место в религии</label>
                        <select id="select-rank" class="w-full p-3 border-2 border-slate-300 rounded-lg outline-none hand-drawn text-lg md:text-xl bg-white cursor-pointer">
                            <option value="Президент">Президент</option>
                            <option value="Премьер-министр">Премьер-министр</option>
                            <option value="Генерал">Генерал</option>
                            <option value="Дипломат">Дипломат</option>
                            <option value="Гражданин" selected>Гражданин</option>
                            <option value="Заключенный">Заключенный</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 gap-3 mt-4">
                        <button id="btn-random" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-4 md:px-6 rounded-xl shadow transition-all flex items-center justify-center gap-2 border-b-4 border-yellow-700 active:border-b-0 active:translate-y-1 text-sm md:text-base">
                            Случайный портрет
                        </button>
                        
                        <div class="relative">
                            <input type="file" id="input-photo-upload" class="hidden" accept="image/*">
                            <button id="btn-upload-trigger" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 md:px-6 rounded-xl border-2 border-slate-300 transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                                📁 Загрузить своё фото
                            </button>
                        </div>

                        <button id="btn-download" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 md:px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                            Скачать PDF
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Предпросмотр -->
            <main class="w-full md:w-2/3 flex items-center justify-center overflow-auto bg-slate-200 p-2 md:p-4 rounded-xl md:rounded-3xl border-2 md:border-4 border-dashed border-slate-300">
                <div id="capture-area" class="bg-white shadow-lg md:shadow-2xl p-0 origin-center scale-[0.65] md:scale-[0.7] lg:scale-100">
                    <div style="width: 210mm; height: 297mm; padding: 15mm; position: relative; background: white; color: black;">
                        <div class="inline-block border border-dashed border-slate-200 p-2 md:p-4">
                            <div class="grid grid-cols-2" style="width: 140mm;">
                                <!-- ВНУТРЕННЯЯ СТРАНИЦА -->
                                <div class="border-4 border-black bg-white p-5 flex flex-col relative preview-inner" style="width: 70mm; height: 100mm;">
                                    <div class="flex justify-between items-start gap-3 h-full">
                                        <div class="flex-1 flex flex-col justify-start space-y-3">
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Ф.И.О.</label>
                                                <div id="view-name" class="hand-drawn text-xl font-bold min-h-[1.2em] break-words">....................</div>
                                            </div>
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Религия</label>
                                                <div id="view-religion" class="hand-drawn text-xl font-bold min-h-[1.2em]">Капибары</div>
                                            </div>
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Статус</label>
                                                <div id="view-rank" class="hand-drawn text-xl font-bold min-h-[1.2em]">Гражданин</div>
                                            </div>
                                        </div>
                                        <div id="portrait-container" class="border-2 border-black bg-stone-50 overflow-hidden shrink-0 flex items-center justify-center relative placeholder-img" style="width: 30mm; height: 40mm;">
                                            <div id="portrait-placeholder" class="hand-drawn text-xs opacity-40 uppercase text-slate-500 text-center p-2">
                                                Для фото
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-auto pt-4 text-[8px] hand-drawn opacity-50 uppercase tracking-widest text-center">
                                        Канцелярия 67-го сектора
                                    </div>
                                </div>
                                <div style="width: 70mm; height: 100mm;" class="border-b-2 border-l-2 border-slate-100 flex items-center justify-center">
                                    <span class="hand-drawn text-[10px] text-slate-300 rotate-90">СГИБ</span>
                                </div>
                                <!-- ЗАДНЯЯ ОБЛОЖКА -->
                                <div class="passport-cover border-4 border-black p-4 flex flex-col items-center justify-center text-center text-white" style="width: 70mm; height: 100mm;">
                                    <div class="bg-white border-2 border-black p-3 rotate-[-2deg] shadow-lg">
                                        <p class="hand-drawn text-xs font-bold leading-tight text-slate-900">
                                            Заверено В.И.В.К. Президентом Великой Империи Величественных Капибар
                                        </p>
                                    </div>
                                </div>
                                <!-- ПЕРЕДНЯЯ ОБЛОЖКА -->
                                <div class="passport-cover border-4 border-black flex flex-col items-center justify-center relative overflow-hidden" style="width: 70mm; height: 100mm;">
                                    <div class="text-[80px] font-bold text-yellow-400 hand-drawn-title drop-shadow-[4px_4px_0px_rgba(0,0,0,1)]">67</div>
                                    <div class="text-[30px] font-bold text-black hand-drawn-title uppercase bg-yellow-400 px-4 py-1 border-y-2 border-black w-full text-center my-4">ПАСПОРТ</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const PORTRAITS_JSON_URL = './portraits/portraits.json';

            const state = {
                portraitsCatalog: {},
                customPhotoProcessed: null,
                lastRandomIndexes: {}
            };

            // Целевые размеры в пикселях (высокое разрешение для PDF)
            const TARGET_WIDTH_PX = 600;   // ~30 мм при 500 DPI
            const TARGET_HEIGHT_PX = 800;  // ~40 мм при 500 DPI

            const inputName = document.getElementById('input-name');
            const selectReligion = document.getElementById('select-religion');
            const selectRank = document.getElementById('select-rank');
            const viewName = document.getElementById('view-name');
            const viewReligion = document.getElementById('view-religion');
            const viewRank = document.getElementById('view-rank');
            const portraitContainer = document.getElementById('portrait-container');
            const portraitPlaceholder = document.getElementById('portrait-placeholder');
            const btnRandom = document.getElementById('btn-random');
            const btnUploadTrigger = document.getElementById('btn-upload-trigger');
            const inputPhotoUpload = document.getElementById('input-photo-upload');
            const btnDownload = document.getElementById('btn-download');

            async function init() {
                inputName.addEventListener('input', updateName);
                selectReligion.addEventListener('change', handleCategoryChange);
                selectRank.addEventListener('change', handleCategoryChange);
                btnRandom.addEventListener('click', selectRandomPortrait);
                btnUploadTrigger.addEventListener('click', () => inputPhotoUpload.click());
                inputPhotoUpload.addEventListener('change', handlePhotoUpload);
                btnDownload.addEventListener('click', generatePDF);

                await loadPortraitsCatalog();
                handleCategoryChange();
            }

            async function loadPortraitsCatalog() {
                try {
                    const response = await fetch(PORTRAITS_JSON_URL);
                    if (response.ok) {
                        state.portraitsCatalog = await response.json();
                    }
                } catch (error) {
                    console.warn('Не удалось загрузить portraits.json:', error);
                }
            }

            function updateName() {
                viewName.innerText = inputName.value || "....................";
            }

            function handleCategoryChange() {
                const religion = selectReligion.value;
                const rank = selectRank.value;
                viewReligion.innerText = religion;
                viewRank.innerText = rank;
                state.customPhotoProcessed = null;
                selectRandomPortrait();
            }

            // === ОСНОВНАЯ ФУНКЦИЯ: обрезка изображения под 3:4 с cover-логикой ===
            function processImageForPortrait(imgSrc) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = imgSrc;

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = TARGET_WIDTH_PX;
                        canvas.height = TARGET_HEIGHT_PX;
                        const ctx = canvas.getContext('2d');

                        // Логика object-fit: cover
                        const imgRatio = img.width / img.height;
                        const targetRatio = TARGET_WIDTH_PX / TARGET_HEIGHT_PX;

                        let sx, sy, sWidth, sHeight;
                        if (imgRatio > targetRatio) {
                            // Изображение шире → обрезаем по ширине
                            sHeight = img.height;
                            sWidth = img.height * targetRatio;
                            sx = (img.width - sWidth) / 2;
                            sy = 0;
                        } else {
                            // Изображение выше → обрезаем по высоте
                            sWidth = img.width;
                            sHeight = img.width / targetRatio;
                            sx = 0;
                            sy = (img.height - sHeight) / 2;
                        }

                        // Чёрный фон на случай прозрачности
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, TARGET_WIDTH_PX, TARGET_HEIGHT_PX);
                        ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, TARGET_WIDTH_PX, TARGET_HEIGHT_PX);

                        // Качество JPEG = 1.0 (максимум)
                        const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                        resolve(dataUrl);
                    };

                    img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
                });
            }

            function showProcessedPhoto(dataUrl) {
                portraitPlaceholder.style.display = 'none';
                portraitContainer.classList.remove('placeholder-img');
                portraitContainer.innerHTML = '';

                const img = document.createElement('img');
                img.className = 'portrait-img';
                img.src = dataUrl;
                img.alt = 'Портрет';
                portraitContainer.appendChild(img);
            }

            function showPlaceholder() {
                portraitContainer.innerHTML = '';
                portraitContainer.classList.add('placeholder-img');
                portraitPlaceholder.style.display = 'flex';
            }

            async function selectRandomPortrait() {
                const religion = selectReligion.value;
                const rank = selectRank.value;
                state.customPhotoProcessed = null;

                const portraits = state.portraitsCatalog[religion]?.[rank] || [];
                if (portraits.length === 0) {
                    showPlaceholder();
                    return;
                }

                const categoryKey = `${religion}_${rank}`;
                const lastIndex = state.lastRandomIndexes[categoryKey];
                let randomIndex;
                if (portraits.length > 1 && lastIndex !== undefined) {
                    const availableIndices = portraits.map((_, i) => i).filter(i => i !== lastIndex);
                    randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                } else {
                    randomIndex = Math.floor(Math.random() * portraits.length);
                }
                state.lastRandomIndexes[categoryKey] = randomIndex;
                const selectedPortrait = portraits[randomIndex];

                try {
                    const processedUrl = await processImageForPortrait(selectedPortrait.url);
                    showProcessedPhoto(processedUrl);
                } catch (e) {
                    console.error('Ошибка обработки случайного портрета:', e);
                    showPlaceholder();
                }
            }

            async function handlePhotoUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.match('image.*')) {
                    alert('Пожалуйста, выберите изображение');
                    return;
                }

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const processedDataUrl = await processImageForPortrait(e.target.result);
                        state.customPhotoProcessed = processedDataUrl;
                        showProcessedPhoto(processedDataUrl);
                    } catch (err) {
                        alert('Не удалось обработать изображение');
                        console.error(err);
                    }
                    event.target.value = '';
                };
                reader.readAsDataURL(file);
            }

            async function generatePDF() {
                const h2p = window.html2pdf;
                if (!h2p) {
                    alert('Ошибка загрузки библиотеки PDF');
                    return;
                }

                const name = inputName.value || 'Гражданина';
                const fileName = `Паспорт_${name.replace(/\s+/g, '_')}.pdf`;

                const originalText = btnDownload.innerHTML;
                btnDownload.innerHTML = '<span>Генерация...</span>';
                btnDownload.disabled = true;

                const captureArea = document.getElementById('capture-area');
                const originalTransform = captureArea.style.transform;
                captureArea.style.transform = 'none';

                const options = {
                    filename: fileName,
                    html2canvas: {
                        scale: 4, // высокое разрешение
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        imageTimeout: 15000,
                        onclone: function(clonedDoc) {
                            const clonedCaptureArea = clonedDoc.getElementById('capture-area');
                            if (clonedCaptureArea) {
                                clonedCaptureArea.style.transform = 'none';
                            }
                        }
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait'
                    }
                };

                h2p().set(options)
                    .from(captureArea)
                    .save()
                    .then(() => {
                        btnDownload.innerHTML = originalText;
                        btnDownload.disabled = false;
                        captureArea.style.transform = originalTransform;
                    })
                    .catch(error => {
                        console.error('Ошибка генерации PDF:', error);
                        alert('Ошибка при создании PDF');
                        btnDownload.innerHTML = originalText;
                        btnDownload.disabled = false;
                        captureArea.style.transform = originalTransform;
                    });
            }

            init();
        });
    </script>
</body>
</html>
