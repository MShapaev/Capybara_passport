<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паспорт Великой Империи Величественных Капибар</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Библиотека для PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .hand-drawn { font-family: 'Caveat', cursive; }
        .hand-drawn-title { font-family: 'Amatic SC', cursive; }
        @media print { .no-print { display: none !important; } }
        .passport-cover { background-color: #991b1b; border: 1px solid #7f1d1d; }
        .portrait-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: center;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #991b1b;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .portrait-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .portrait-thumb:hover {
            border-color: #991b1b;
            transform: scale(1.05);
        }
        .portrait-thumb.selected {
            border-color: #991b1b;
            border-width: 3px;
            box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.2);
        }
        .placeholder-img {
            background: linear-gradient(45deg, #f3f4f6 25%, #e5e7eb 25%, #e5e7eb 50%, #f3f4f6 50%, #f3f4f6 75%, #e5e7eb 75%);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-stone-100 text-slate-900 min-h-screen">
    <div id="app-root">
        <div class="flex flex-col md:flex-row min-h-screen gap-6 p-4 md:p-8">
            <!-- Панель управления -->
            <aside class="w-full md:w-1/3 space-y-6 no-print">
                <header class="bg-red-800 text-white p-6 rounded-2xl shadow-xl border-b-4 border-red-950">
                    <h1 class="text-4xl font-bold hand-drawn-title flex items-center gap-3 text-yellow-400">
                        Канцелярия В.И.В.К.
                    </h1>
                    <p class="opacity-90 mt-2 font-medium">Создание документа №67</p>
                    <div id="portraits-status" class="mt-2 text-xs bg-black/30 px-2 py-1 rounded inline-flex items-center gap-1">
                        <div id="status-spinner" class="loading-spinner" style="width: 12px; height: 12px; border-width: 2px;"></div>
                        <span id="status-text">Загрузка каталога...</span>
                    </div>
                </header>

                <div class="bg-white p-6 rounded-2xl shadow-lg space-y-5 border-2 border-slate-200">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Полное имя (Ф.И.О.)</label>
                        <input id="input-name" type="text" class="w-full p-3 border-2 border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none hand-drawn text-xl" placeholder="Введите имя...">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Религия</label>
                        <select id="select-religion" class="w-full p-3 border-2 border-slate-300 rounded-lg outline-none hand-drawn text-xl bg-white cursor-pointer">
                            <option value="Капибары">Капибары</option>
                            <option value="Грибовики">Грибовики</option>
                            <option value="Скебобы">Скебобы</option>
                            <option value="Тапки">Тапки</option>
                            <option value="Нейтралы">Нейтралы</option>
                            <option value="Смайлы">Смайлы</option>
                            <option value="Мопсы">Мопсы</option>
                            <option value="Берсерки">Берсерки</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Место в религии</label>
                        <select id="select-rank" class="w-full p-3 border-2 border-slate-300 rounded-lg outline-none hand-drawn text-xl bg-white cursor-pointer">
                            <option value="Президент">Президент</option>
                            <option value="Премьер-министр">Премьер-министр</option>
                            <option value="Генерал">Генерал</option>
                            <option value="Дипломат">Дипломат</option>
                            <option value="Гражданин" selected>Гражданин</option>
                            <option value="Заключенный">Заключенный</option>
                        </select>
                    </div>

                    <!-- Галерея портретов -->
                    <div id="portrait-gallery" class="hidden">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Выберите портрет:</label>
                            <span id="gallery-count" class="text-xs text-slate-500">0 портретов</span>
                        </div>
                        <div id="gallery-container" class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto p-2 border border-slate-200 rounded-lg bg-slate-50">
                            <!-- Превью портретов будут добавлены здесь -->
                            <div class="col-span-4 text-center text-slate-400 text-sm py-8">
                                Загрузка портретов...
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-3 mt-4">
                        <button id="btn-random" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-6 rounded-xl shadow transition-all flex items-center justify-center gap-2 border-b-4 border-yellow-700 active:border-b-0 active:translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span id="random-text">Случайный портрет</span>
                            <div id="random-loading" class="hidden loading-spinner"></div>
                        </button>
                        
                        <div class="relative">
                            <input type="file" id="input-photo-upload" class="hidden" accept="image/*">
                            <button id="btn-upload-trigger" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-6 rounded-xl border-2 border-slate-300 transition-all flex items-center justify-center gap-2">
                                📁 Загрузить своё фото
                            </button>
                        </div>

                        <button id="btn-download" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                            Скачать PDF (HQ)
                        </button>
                    </div>
                    
                    <div id="portrait-info" class="text-xs text-slate-500 text-center">
                        <div id="portrait-count" class="mb-1"></div>
                        <div id="portrait-path" class="truncate font-mono text-[10px]"></div>
                    </div>
                </div>
            </aside>

            <!-- Предпросмотр -->
            <main class="w-full md:w-2/3 flex items-start justify-center overflow-auto bg-slate-200 p-8 rounded-3xl border-4 border-dashed border-slate-300">
                <div id="capture-area" class="bg-white shadow-2xl p-0 origin-top scale-75 lg:scale-100">
                    <div style="width: 210mm; height: 297mm; padding: 15mm; position: relative; background: white; color: black;">
                        <div class="inline-block border-2 border-dashed border-slate-200 p-4">
                            <div class="grid grid-cols-2" style="width: 140mm;">
                                <!-- ВНУТРЕННЯЯ СТРАНИЦА -->
                                <div class="border-4 border-black bg-white p-5 flex flex-col relative rotate-180" style="width: 70mm; height: 100mm;">
                                    <div class="flex justify-between items-start gap-3 h-full">
                                        <div class="flex-1 flex flex-col justify-start space-y-3">
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Ф.И.О.</label>
                                                <div id="view-name" class="hand-drawn text-xl font-bold min-h-[1.2em] break-words">....................</div>
                                            </div>
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Религия</label>
                                                <div id="view-religion" class="hand-drawn text-xl font-bold min-h-[1.2em]">Капибары</div>
                                            </div>
                                            <div class="border-b-2 border-black pb-1">
                                                <label class="hand-drawn font-bold text-[10px] block uppercase text-slate-400 leading-none">Статус</label>
                                                <div id="view-rank" class="hand-drawn text-xl font-bold min-h-[1.2em]">Гражданин</div>
                                            </div>
                                        </div>
                                        <div id="portrait-container" class="border-2 border-black bg-stone-50 overflow-hidden shrink-0 flex items-center justify-center relative placeholder-img" style="width: 30mm; height: 40mm;">
                                            <div id="portrait-placeholder" class="hand-drawn text-xs opacity-40 uppercase text-slate-500 text-center p-2">
                                                <div>Для фото</div>
                                                <div class="text-[8px] mt-1">Выберите портрет<br>или загрузите свой</div>
                                            </div>
                                            <div id="portrait-loading" class="absolute hidden loading-spinner z-10"></div>
                                        </div>
                                    </div>
                                    <div class="mt-auto pt-4 text-[8px] hand-drawn opacity-50 uppercase tracking-widest text-center">
                                        Канцелярия 67-го сектора
                                    </div>
                                </div>
                                <div style="width: 70mm; height: 100mm;" class="border-b-2 border-l-2 border-slate-100 flex items-center justify-center">
                                    <span class="hand-drawn text-[10px] text-slate-300 rotate-90">СГИБ</span>
                                </div>
                                <!-- ЗАДНЯЯ ОБЛОЖКА -->
                                <div class="passport-cover border-4 border-black p-4 flex flex-col items-center justify-center text-center text-white" style="width: 70mm; height: 100mm;">
                                    <div class="bg-white border-2 border-black p-3 rotate-[-2deg] shadow-lg">
                                        <p class="hand-drawn text-xs font-bold leading-tight text-slate-900">
                                            Заверено В.И.В.К. Президентом Великой Империи Величественных Капибар
                                        </p>
                                    </div>
                                </div>
                                <!-- ПЕРЕДНЯЯ ОБЛОЖКА -->
                                <div class="passport-cover border-4 border-black flex flex-col items-center justify-center relative overflow-hidden" style="width: 70mm; height: 100mm;">
                                    <div class="text-[80px] font-bold text-yellow-400 hand-drawn-title drop-shadow-[4px_4px_0px_rgba(0,0,0,1)]">67</div>
                                    <div class="text-[30px] font-bold text-black hand-drawn-title uppercase bg-yellow-400 px-4 py-1 border-y-2 border-black w-full text-center my-4">ПАСПОРТ</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Канцелярия В.И.В.К. активна.");

            // Конфигурация
            const RELIGIONS = ['Капибары', 'Грибовики', 'Скебобы', 'Тапки', 'Нейтралы', 'Смайлы', 'Мопсы', 'Берсерки'];
            const RANKS = ['Президент', 'Премьер-министр', 'Генерал', 'Дипломат', 'Гражданин', 'Заключенный'];
            const PORTRAITS_JSON_URL = './portraits/portraits.json';

            // Состояние приложения
            const state = {
                portraitsCatalog: {}, // Загруженные данные из JSON
                selectedPortrait: null, // Выбранный портрет
                customPhoto: null, // Пользовательское фото
                lastRandomIndexes: {}, // Для отслеживания последних случайных выборов
                isLoading: false
            };

            // DOM элементы
            const inputName = document.getElementById('input-name');
            const selectReligion = document.getElementById('select-religion');
            const selectRank = document.getElementById('select-rank');
            const viewName = document.getElementById('view-name');
            const viewReligion = document.getElementById('view-religion');
            const viewRank = document.getElementById('view-rank');
            const portraitContainer = document.getElementById('portrait-container');
            const portraitPlaceholder = document.getElementById('portrait-placeholder');
            const portraitLoading = document.getElementById('portrait-loading');
            const btnRandom = document.getElementById('btn-random');
            const randomText = document.getElementById('random-text');
            const randomLoading = document.getElementById('random-loading');
            const btnUploadTrigger = document.getElementById('btn-upload-trigger');
            const inputPhotoUpload = document.getElementById('input-photo-upload');
            const btnDownload = document.getElementById('btn-download');
            const portraitInfo = document.getElementById('portrait-info');
            const portraitCount = document.getElementById('portrait-count');
            const portraitPath = document.getElementById('portrait-path');
            const portraitsStatus = document.getElementById('portraits-status');
            const statusSpinner = document.getElementById('status-spinner');
            const statusText = document.getElementById('status-text');
            const portraitGallery = document.getElementById('portrait-gallery');
            const galleryContainer = document.getElementById('gallery-container');
            const galleryCount = document.getElementById('gallery-count');

            // Инициализация
            async function init() {
                // Настройка событий
                inputName.addEventListener('input', updateName);
                selectReligion.addEventListener('change', updateGallery);
                selectRank.addEventListener('change', updateGallery);
                btnRandom.addEventListener('click', selectRandomPortrait);
                btnUploadTrigger.addEventListener('click', () => inputPhotoUpload.click());
                inputPhotoUpload.addEventListener('change', handlePhotoUpload);
                btnDownload.addEventListener('click', generatePDF);

                // Загружаем каталог портретов
                await loadPortraitsCatalog();
                
                // Инициализируем первый просмотр
                updateGallery();
            }

            // Загрузка каталога портретов из JSON
            async function loadPortraitsCatalog() {
                updateStatus('Загрузка каталога портретов...', 'loading');
                
                try {
                    const response = await fetch(PORTRAITS_JSON_URL);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    state.portraitsCatalog = data;
                    
                    // Обновляем статус
                    const totalPortraits = Object.values(data).reduce((total, religion) => {
                        return total + Object.values(religion).reduce((sum, portraits) => sum + portraits.length, 0);
                    }, 0);
                    
                    updateStatus(`Загружено портретов: ${totalPortraits}`, 'success');
                    
                    // Показываем галерею
                    portraitGallery.classList.remove('hidden');
                    
                } catch (error) {
                    console.error('Ошибка загрузки каталога:', error);
                    updateStatus('Ошибка загрузки каталога', 'error');
                    
                    // Создаем пустой каталог
                    state.portraitsCatalog = {};
                    RELIGIONS.forEach(religion => {
                        state.portraitsCatalog[religion] = {};
                        RANKS.forEach(rank => {
                            state.portraitsCatalog[religion][rank] = [];
                        });
                    });
                    
                    // Показываем сообщение в галерее
                    galleryContainer.innerHTML = `
                        <div class="col-span-4 text-center text-slate-400 text-sm py-8">
                            <div class="mb-2">⚠️ Каталог портретов не найден</div>
                            <div class="text-xs">Запустите generate_portraits_json.py для создания каталога</div>
                        </div>
                    `;
                }
            }

            // Обновление статуса
            function updateStatus(message, type = 'info') {
                statusText.textContent = message;
                
                // Убираем спиннер
                statusSpinner.style.display = 'none';
                
                // Добавляем иконку в зависимости от типа
                let icon = '';
                switch(type) {
                    case 'loading':
                        statusSpinner.style.display = 'block';
                        icon = '';
                        break;
                    case 'success':
                        icon = '✓';
                        portraitsStatus.classList.add('text-green-400');
                        break;
                    case 'error':
                        icon = '✗';
                        portraitsStatus.classList.add('text-red-400');
                        break;
                    default:
                        icon = 'ℹ️';
                }
                
                if (icon) {
                    statusText.innerHTML = `<span class="mr-1">${icon}</span>${message}`;
                }
            }

            // Обновление имени
            function updateName() {
                viewName.innerText = inputName.value || "....................";
            }

            // Обновление галереи
            function updateGallery() {
                const religion = selectReligion.value;
                const rank = selectRank.value;
                
                viewReligion.innerText = religion;
                viewRank.innerText = rank;
                
                // Получаем портреты для выбранной категории
                const portraits = state.portraitsCatalog[religion]?.[rank] || [];
                
                // Обновляем счетчик в галерее
                galleryCount.textContent = `${portraits.length} портретов`;
                
                // Очищаем галерею
                galleryContainer.innerHTML = '';
                
                if (portraits.length === 0) {
                    // Нет портретов для этой категории
                    galleryContainer.innerHTML = `
                        <div class="col-span-4 text-center text-slate-400 text-sm py-8">
                            <div class="mb-2">Нет портретов для этой категории</div>
                            <div class="text-xs">Добавьте файлы в папку portraits/${getFolderName(religion)}/${getRankFolderName(rank)}/</div>
                        </div>
                    `;
                    btnRandom.disabled = true;
                    return;
                }
                
                // Включаем кнопку случайного выбора
                btnRandom.disabled = false;
                
                // Создаем миниатюры
                portraits.forEach(portrait => {
                    const thumbWrapper = document.createElement('div');
                    thumbWrapper.className = 'relative';
                    
                    const thumb = document.createElement('img');
                    thumb.src = portrait.url;
                    thumb.alt = `Портрет ${portrait.number}`;
                    thumb.className = 'portrait-thumb';
                    thumb.title = `Портрет ${portrait.number}`;
                    thumb.dataset.url = portrait.url;
                    thumb.dataset.filename = portrait.filename;
                    
                    // Номер портрета
                    const numberBadge = document.createElement('div');
                    numberBadge.className = 'absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center';
                    numberBadge.textContent = portrait.number;
                    
                    thumb.addEventListener('click', () => {
                        selectPortrait(portrait, religion, rank);
                        highlightThumb(thumb);
                    });
                    
                    thumb.addEventListener('error', () => {
                        thumb.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="%23f3f4f6"/><text x="40" y="40" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="%239ca3af">Ошибка</text></svg>';
                        thumb.title = 'Ошибка загрузки изображения';
                    });
                    
                    thumbWrapper.appendChild(thumb);
                    thumbWrapper.appendChild(numberBadge);
                    galleryContainer.appendChild(thumbWrapper);
                });
                
                // Если нет выбранного портрета, выбираем первый
                if (!state.selectedPortrait || 
                    state.selectedPortrait.religion !== religion || 
                    state.selectedPortrait.rank !== rank) {
                    
                    if (portraits.length > 0) {
                        selectPortrait(portraits[0], religion, rank);
                        highlightThumb(galleryContainer.querySelector('.portrait-thumb'));
                    } else {
                        showPlaceholder();
                    }
                }
            }

            // Выбор портрета
            function selectPortrait(portrait, religion, rank) {
                state.selectedPortrait = {
                    portrait: portrait,
                    religion: religion,
                    rank: rank
                };
                state.customPhoto = null;
                
                // Показываем портрет
                showPortrait(portrait.url, portrait.filename);
                
                // Обновляем информацию
                updatePortraitInfo(portrait, religion, rank);
            }

            // Подсветка выбранной миниатюры
            function highlightThumb(selectedThumb) {
                galleryContainer.querySelectorAll('.portrait-thumb').forEach(thumb => {
                    thumb.classList.remove('selected');
                });
                selectedThumb?.classList.add('selected');
            }

            // Показать портрет
            function showPortrait(url, filename) {
                portraitLoading.classList.remove('hidden');
                portraitPlaceholder.style.display = 'none';
                portraitContainer.classList.remove('placeholder-img');
                
                // Очищаем контейнер
                portraitContainer.innerHTML = '';
                
                // Создаем изображение
                const img = new Image();
                img.className = 'portrait-img absolute inset-0 grayscale-[20%]';
                img.src = url;
                img.alt = filename;
                
                img.onload = () => {
                    portraitContainer.appendChild(img);
                    portraitLoading.classList.add('hidden');
                };
                
                img.onerror = () => {
                    showPlaceholder();
                    portraitLoading.classList.add('hidden');
                    console.error(`Ошибка загрузки изображения: ${url}`);
                };
            }

            // Показать заглушку
            function showPlaceholder() {
                portraitContainer.innerHTML = '';
                portraitContainer.classList.add('placeholder-img');
                portraitPlaceholder.style.display = 'flex';
                portraitLoading.classList.add('hidden');
            }

            // Выбор случайного портрета
            function selectRandomPortrait() {
                const religion = selectReligion.value;
                const rank = selectRank.value;
                
                const portraits = state.portraitsCatalog[religion]?.[rank] || [];
                
                if (portraits.length === 0) {
                    showPlaceholder();
                    return;
                }
                
                // Получаем последний индекс для этой категории
                const categoryKey = `${religion}_${rank}`;
                const lastIndex = state.lastRandomIndexes[categoryKey];
                
                let randomIndex;
                
                // Если есть несколько портретов, выбираем отличный от последнего
                if (portraits.length > 1 && lastIndex !== undefined) {
                    const availableIndices = portraits.map((_, i) => i).filter(i => i !== lastIndex);
                    randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                } else {
                    randomIndex = Math.floor(Math.random() * portraits.length);
                }
                
                // Сохраняем индекс
                state.lastRandomIndexes[categoryKey] = randomIndex;
                
                const selectedPortrait = portraits[randomIndex];
                
                // Выбираем портрет
                selectPortrait(selectedPortrait, religion, rank);
                
                // Подсвечиваем соответствующую миниатюру
                const thumbs = galleryContainer.querySelectorAll('.portrait-thumb');
                if (thumbs[randomIndex]) {
                    highlightThumb(thumbs[randomIndex]);
                }
            }

            // Обновление информации о портрете
            function updatePortraitInfo(portrait, religion, rank) {
                const portraits = state.portraitsCatalog[religion]?.[rank] || [];
                
                if (portrait) {
                    portraitCount.textContent = `Портрет ${portrait.number} из ${portraits.length}`;
                    portraitPath.textContent = portrait.filename;
                } else {
                    portraitCount.textContent = 'Нет выбранного портрета';
                    portraitPath.textContent = '';
                }
            }

            // Получение имени папки для религии
            function getFolderName(religion) {
                const mapping = {
                    'Капибары': 'capybara',
                    'Грибовики': 'mushroom',
                    'Скебобы': 'bird',
                    'Тапки': 'slipper',
                    'Нейтралы': 'neutral',
                    'Смайлы': 'smile',
                    'Мопсы': 'pug',
                    'Берсерки': 'berserker'
                };
                return mapping[religion] || religion.toLowerCase();
            }

            // Получение имени папки для ранга
            function getRankFolderName(rank) {
                const mapping = {
                    'Президент': 'president',
                    'Премьер-министр': 'pm',
                    'Генерал': 'general',
                    'Дипломат': 'diplomat',
                    'Гражданин': 'citizen',
                    'Заключенный': 'prisoner'
                };
                return mapping[rank] || rank.toLowerCase();
            }

            // Обработка загрузки фото с компьютера
            function handlePhotoUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                // Проверяем тип файла
                if (!file.type.match('image.*')) {
                    alert('Пожалуйста, выберите изображение (JPG, PNG, GIF)');
                    return;
                }
                
                // Проверяем размер файла (максимум 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert('Размер файла не должен превышать 10MB');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    state.customPhoto = e.target.result;
                    state.selectedPortrait = null;
                    
                    // Очищаем контейнер
                    portraitContainer.innerHTML = '';
                    portraitContainer.classList.remove('placeholder-img');
                    portraitPlaceholder.style.display = 'none';
                    
                    // Создаем изображение
                    const img = new Image();
                    img.className = 'portrait-img absolute inset-0';
                    img.src = state.customPhoto;
                    
                    img.onload = () => {
                        // Автоматически масштабируем и обрезаем изображение
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Размеры области портрета (30x40 мм примерно 85x113 пикселей при 72 DPI)
                        // Увеличиваем для качества
                        const width = 255; // 30mm * 3 (для масштаба)
                        const height = 340; // 40mm * 3
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        // Вычисляем масштаб и позицию для заполнения области
                        const scale = Math.max(width / img.width, height / img.height);
                        const x = (width - img.width * scale) / 2;
                        const y = (height - img.height * scale) / 2;
                        
                        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        
                        // Заменяем изображение на обработанное
                        portraitContainer.innerHTML = '';
                        const processedImg = new Image();
                        processedImg.className = 'portrait-img absolute inset-0';
                        processedImg.src = canvas.toDataURL('image/jpeg', 0.9);
                        portraitContainer.appendChild(processedImg);
                    };
                    
                    portraitContainer.appendChild(img);
                    
                    // Сбрасываем выделение в галерее
                    galleryContainer.querySelectorAll('.portrait-thumb').forEach(t => {
                        t.classList.remove('selected');
                    });
                    
                    // Обновляем информацию
                    portraitCount.textContent = 'Загружено пользовательское фото';
                    portraitPath.textContent = file.name;
                    
                    // Сбрасываем input
                    event.target.value = '';
                };
                
                reader.readAsDataURL(file);
            }

            // Генерация PDF
            function generatePDF() {
                const h2p = window.html2pdf;
                if (!h2p) {
                    alert('Ошибка загрузки библиотеки PDF. Пожалуйста, обновите страницу.');
                    return;
                }
                
                // Проверяем, есть ли фото
                if (!state.customPhoto && !state.selectedPortrait) {
                    if (!confirm('Портрет не выбран. Создать паспорт без фото?')) {
                        return;
                    }
                }
                
                // Подготавливаем имя файла
                const name = inputName.value || 'Гражданина';
                const fileName = `Паспорт_${name.replace(/\s+/g, '_')}.pdf`;
                
                // Показываем уведомление
                const originalText = btnDownload.innerHTML;
                btnDownload.innerHTML = '<span>Генерация PDF...</span>';
                btnDownload.disabled = true;
                
                // Конфигурация html2pdf
                const options = {
                    filename: fileName,
                    html2canvas: { 
                        scale: 3,
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        onclone: function(clonedDoc) {
                            // Убираем индикаторы загрузки в клоне
                            const cloneLoading = clonedDoc.getElementById('portrait-loading');
                            if (cloneLoading) cloneLoading.style.display = 'none';
                        }
                    },
                    jsPDF: { 
                        unit: 'mm', 
                        format: 'a4', 
                        orientation: 'portrait',
                        compress: true
                    },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                };
                
                // Генерируем PDF
                h2p().set(options)
                    .from(document.getElementById('capture-area'))
                    .save()
                    .then(() => {
                        // Восстанавливаем кнопку
                        btnDownload.innerHTML = originalText;
                        btnDownload.disabled = false;
                    })
                    .catch(error => {
                        console.error('Ошибка генерации PDF:', error);
                        alert('Ошибка при создании PDF. Пожалуйста, попробуйте еще раз.');
                        btnDownload.innerHTML = originalText;
                        btnDownload.disabled = false;
                    });
            }

            // Запуск приложения
            init();
        });
    </script>
</body>
</html>
